name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ScopedDriveMcp.slnx
      - run: dotnet build ScopedDriveMcp.slnx --no-restore -c Release
      - run: dotnet test ScopedDriveMcp.slnx --no-build -c Release --verbosity normal
